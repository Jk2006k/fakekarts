<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8bd8ff" />
    <meta name="description" content="FakeKarts — a tiny multiplayer toon racer." />
    <title>FakeKarts</title>
  </head>
  <body>
    <main id="game" aria-label="FakeKarts game">
      <canvas id="world"></canvas>

      <header class="topbar">
        <a class="brand" href="/" aria-label="FakeKarts home"><i></i>FAKE<span>KARTS</span></a>
        <div class="room"><span class="pulse"></span> ROOM <b id="room-name">NOT JOINED</b></div>
        <div class="header-actions">
          <button id="sound" class="icon-button" aria-label="Toggle sound">♪</button>
          <button id="settings" class="icon-button" aria-label="Open game settings">⚙</button>
        </div>
      </header>

      <section id="hud" class="hud hidden" aria-live="polite">
        <div class="position"><strong id="position">2</strong><small>DRIVERS</small></div>
        <div class="lap"><small>MODE</small><b>FREE RIDE</b></div>
        <div class="speed"><strong id="speed">0</strong><span>KM/H</span><div><i id="speedbar"></i></div></div>
        <div id="drift-status" class="drift-status">DRIFTING</div>
        <div class="weapon-hud"><small>WEAPON</small><b>PISTOL</b><span>∞</span></div>
        <div class="crosshair" aria-hidden="true">+</div>
        <div class="players" id="players"></div>
        <div class="leaderboard" id="leaderboard"></div>
      </section>

      <section id="menu" class="menu">
        <p class="eyebrow">WELCOME TO</p>
        <h1>FAKE<br /><em>KARTS</em></h1>
        <p class="tagline">Tiny wheels. Big feelings.</p>
        <label class="name-field">DRIVER NAME<input id="name" maxlength="12" value="Mohan" /></label>
        <label class="name-field room-field">ROOM CODE<input id="room-code" maxlength="3" inputmode="numeric" pattern="[0-9]{3}" autocomplete="off" spellcheck="false" /></label>
        <div class="room-actions">
          <button id="create-room" class="create-button">CREATE ROOM</button>
          <button id="join-room" class="race-button"><span>JOIN ROOM</span><b>›</b></button>
        </div>
        <p id="join-error" class="join-error" role="alert"></p>
        <p class="hint"><kbd>WASD</kbd> drive · <kbd>SPACE</kbd> drift · <kbd>F</kbd> or click to fire</p>
      </section>

      <section id="lobby" class="arena-lobby hidden" aria-label="Room lobby">
        <div class="lobby-card">
          <p class="room-code-label">ROOM CODE</p>
          <strong id="lobby-room-code" class="lobby-room-code"></strong>
          <h2>PLAYERS</h2>
          <div id="lobby-players" class="lobby-players"></div>
          <p id="room-status">WAITING FOR THE OWNER TO START…</p>
          <button id="start-room" class="race-button hidden"><span>START RACE</span><b>›</b></button>
        </div>
      </section>

      <div id="countdown" class="countdown" aria-live="assertive"></div>
      <div id="presence-toast" class="presence-toast" role="status" aria-live="polite"></div>
      <div class="controls" aria-label="Touch controls">
        <button data-key="left" aria-label="Turn left">←</button>
        <button class="drift-control" data-key="drift" aria-label="Drift">DRIFT</button>
        <button class="fire-control" data-key="fire" aria-label="Fire pistol">FIRE</button>
        <div><button data-key="forward" aria-label="Accelerate">↑</button><button data-key="back" aria-label="Brake">↓</button></div>
        <button data-key="right" aria-label="Turn right">→</button>
      </div>
      <dialog id="settings-panel" class="settings-panel">
        <form method="dialog">
          <header><h2>GAME SETTINGS</h2><button aria-label="Close settings">×</button></header>
          <label class="setting">CAMERA DISTANCE<select id="setting-cameraDistance"><option value="8">LOW</option><option value="12">MEDIUM</option><option value="16">HIGH</option><option value="20">XHIGH</option></select></label>
          <label class="setting">CAMERA HEIGHT<select id="setting-cameraHeight"><option value="4">LOW</option><option value="6.5">MEDIUM</option><option value="9">HIGH</option><option value="12">XHIGH</option></select></label>
          <label class="setting">STEERING SENSITIVITY<select id="setting-steeringSensitivity"><option value="0.7">LOW</option><option value="1">MEDIUM</option><option value="1.35">HIGH</option><option value="1.7">XHIGH</option></select></label>
          <label class="setting">DRIFT STRENGTH<select id="setting-driftStrength"><option value="0.8">LOW</option><option value="1.15">MEDIUM</option><option value="1.45">HIGH</option><option value="1.8">XHIGH</option></select></label>
          <button id="reset-settings" class="reset-settings">RESET DEFAULTS</button>
        </form>
      </dialog>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
