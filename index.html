<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8bd8ff" />
    <meta name="description" content="FakeKarts — a tiny multiplayer toon racer." />
    <title>FakeKarts</title>
  </head>
  <body>
    <main id="game" aria-label="FakeKarts game">
      <canvas id="world"></canvas>

      <header class="topbar">
        <a class="brand" href="/" aria-label="FakeKarts home"><i></i>FAKE<span>KARTS</span></a>
        <div class="room"><span class="pulse"></span> ROOM <b id="room-name">NOT JOINED</b></div>
        <button id="sound" class="icon-button" aria-label="Toggle sound">♪</button>
      </header>

      <section id="hud" class="hud hidden" aria-live="polite">
        <div class="position"><strong id="position">2</strong><small>DRIVERS</small></div>
        <div class="lap"><small>MODE</small><b>FREE RIDE</b></div>
        <div class="speed"><strong id="speed">0</strong><span>KM/H</span><div><i id="speedbar"></i></div></div>
        <div class="players" id="players"></div>
        <div class="leaderboard" id="leaderboard"></div>
      </section>

      <section id="menu" class="menu">
        <p class="eyebrow">WELCOME TO</p>
        <h1>FAKE<br /><em>KARTS</em></h1>
        <p class="tagline">Tiny wheels. Big feelings.</p>
        <label class="name-field">DRIVER NAME<input id="name" maxlength="12" value="Mohan" /></label>
        <label class="name-field room-field">ROOM CODE<input id="room-code" maxlength="16" autocomplete="off" spellcheck="false" /></label>
        <div class="room-actions">
          <button id="create-room" class="create-button">CREATE ROOM</button>
          <button id="join-room" class="race-button"><span>JOIN ROOM</span><b>›</b></button>
        </div>
        <p id="join-error" class="join-error" role="alert"></p>
        <p class="hint"><kbd>WASD</kbd> or <kbd>ARROWS</kbd> to drive · <kbd>SPACE</kbd> to drift</p>
      </section>

      <section id="lobby" class="arena-lobby hidden" aria-label="Room lobby">
        <div class="lobby-card">
          <p class="eyebrow">ROOM <strong id="lobby-room-code"></strong></p>
          <h2>PLAYERS</h2>
          <div id="lobby-players" class="lobby-players"></div>
          <p id="room-status">WAITING FOR THE OWNER TO START…</p>
          <button id="start-room" class="race-button hidden"><span>START RACE</span><b>›</b></button>
        </div>
      </section>

      <div id="countdown" class="countdown" aria-live="assertive"></div>
      <div id="presence-toast" class="presence-toast" role="status" aria-live="polite"></div>
      <div class="controls" aria-label="Touch controls">
        <button data-key="left" aria-label="Turn left">←</button>
        <button class="drift-control" data-key="drift" aria-label="Drift">DRIFT</button>
        <div><button data-key="forward" aria-label="Accelerate">↑</button><button data-key="back" aria-label="Brake">↓</button></div>
        <button data-key="right" aria-label="Turn right">→</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
